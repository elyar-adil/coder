<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

}

  --bg-gradient: linear-gradient(160deg, #f0f4f8 0%, #e8ecf1 50%, #f5f7fa 100%);
  --surface: rgba(255, 255, 255, 0.8);
  --surface-solid: #ffffff;
  --surface2: rgba(241, 245, 249, 0.7);
  --surface3: rgba(226, 232, 240, 0.6);
  --border: rgba(148, 163, 184, 0.3);
  --border-solid: #cbd5e1;
  --border-soft: rgba(148, 163, 184, 0.2);
  --text: #0f172a;
  --text-muted: #64748b;
  --text-soft: #475569;
  --accent: #0284c7;
  --accent-hi: #0369a1;
  --accent-glow: rgba(2, 132, 199, 0.1);
  --plan-accent: #9333ea;
  --plan-glow: rgba(147, 51, 234, 0.08);
  --success: #16a34a;
  --success-glow: rgba(22, 163, 74, 0.08);
  --warning: #d97706;
  --warning-glow: rgba(217, 119, 6, 0.08);
  --danger: #dc2626;
  --danger-glow: rgba(220, 38, 38, 0.08);
  --running: #0284c7;
  --tool-bg: rgba(241, 245, 249, 0.9);
  --glass: rgba(255, 255, 255, 0.7);
  --glass-border: rgba(148, 163, 184, 0.25);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.06);

  --shadow-lg: 0 8px 32px rgba(0,0,0,.12);
}
html, body { height: 100%; }
body {

.goal-item .goal-icon.failed { background: var(--danger-glow); color: var(--danger); border: 1px solid var(--danger); }

.goal-item .goal-task-name { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
#task-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.task-item {

  display: flex;
  align-items: flex-start;
  gap: 10px;
  border-left: 2px solid transparent;
  transition: all var(--transition);
  user-select: none;
}
.task-item:hover { background: var(--surface2); }
.task-item.active { background: var(--surface2); border-left-color: var(--accent); }
.task-item .task-icon {
  flex-shrink: 0;
  width: 20px; height: 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  margin-top: 1px;
  transition: all var(--transition);
}
.task-item .task-icon.running { background: var(--accent-glow); color: var(--accent); animation: pulse-ring 2s ease-in-out infinite; }
.task-item .task-icon.completed { background: var(--success-glow); color: var(--success); }
.task-item .task-icon.failed { background: var(--danger-glow); color: var(--danger); }
.task-item .task-icon.queued { background: var(--surface3); color: var(--text-muted); }
.task-item .task-icon.waiting_user, .task-item .task-icon.blocked { background: var(--warning-glow); color: var(--warning); }
.task-item .task-meta { min-width: 0; flex: 1; }
.task-item .task-title { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-soft); font-weight: 500; }
.task-item.active .task-title { color: var(--text); }
.task-item .task-status { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
@keyframes pulse-ring {

}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.mode-row { position: relative; flex-shrink: 0; align-self: flex-end; }

function fmtTime(ts) {

}
function diffClass(line) {
  if (/^(diff --git|index |--- |\+\+\+ )/.test(line)) return 'diff-file';
  if (line.startsWith('@@')) return 'diff-hunk';
  if (line.startsWith('+') && !line.startsWith('+++')) return 'diff-add';
  if (line.startsWith('-') && !line.startsWith('---')) return 'diff-del';
  return '';
}
function renderDiffLines(text) {
  return String(text ?? '').split('\n').map(line => {
    const cls = diffClass(line);
    return '<span class="diff-line ' + cls + '">' + escHtml(line) || ' ' + '</span>';
  }).join('');
}
function patchDiffMarkdown(patch) {
  return (patch?.files || []).map(file => file.diff || (file.path ? 'Changed ' + file.path : '')).filter(Boolean).join('\n\n');
}
function looksLikeDiff(text) {
  return /(^|\n)(diff --git|@@ |--- |\+\+\+ |[+-][^\n]*)/.test(String(text ?? ''));
}
function displayFileName(filePath) {
  const normalized = normalizeLocalFilePath(filePath).replace(/[?#].*$/, '');
  const parts = normalized.split(/[\\/]+/).filter(Boolean);
  return parts.at(-1) || 'download';
}
const FILE_EXT_PATTERN = '(?:pptx?|pdf|docx?|xlsx?|csv|zip|tar\\.gz|png|jpe?g|gif|webp|svg|html?|md|txt|json)';
const FILE_EXT_RE = new RegExp('\\.(' + FILE_EXT_PATTERN + ')$', 'i');
const DOWNLOAD_MARKER_RE = /\[\[download:([^\]|]+)(?:\|([^\]]+))?\]\]/gi;
const PREVIEW_MARKER_RE = /\[\[preview:([^\]|]+)(?:\|([^\]]+))?\]\]/gi;
function normalizeLocalFilePath(value) {
  const raw = String(value || '').trim().replace(/^<|>$/g, '');
  if (!raw) return '';
  if (raw.startsWith('file://')) {
    try { return decodeURIComponent(raw.slice('file://'.length)); } catch { return raw.slice('file://'.length); }
  }
  return raw;
}
function isDownloadMarkerPath(value) {
  const raw = String(value || '').trim().replace(/^<|>$/g, '');
  const path = normalizeLocalFilePath(raw);
  return Boolean(path) && FILE_EXT_RE.test(path) && !/^[a-z][a-z0-9+.-]*:/i.test(path);
}
function downloadHref(filePath) {
  return '/api/download?path=' + encodeURIComponent(normalizeLocalFilePath(filePath));
}
function fileLinkHtml(filePath, label) {
  const path = normalizeLocalFilePath(filePath);
  const text = String(label || '').trim() || displayFileName(path);
  return '<a class="file-link" href="' + escAttr(downloadHref(path)) + '" download title="' + escAttr(path) + '"><code>' + escHtml(text) + '</code></a>';
}
function replaceDownloadMarkers(text, render) {
  return String(text ?? '').replace(DOWNLOAD_MARKER_RE, (match, filePath, label) => {
    const path = String(filePath || '').trim();
    if (!isDownloadMarkerPath(path)) return match;
    return render(path, String(label || '').trim() || displayFileName(path));
  });
}
function previewHtml(filePath) {
  const path = normalizeLocalFilePath(filePath);
  const url = '/api/download?path=' + encodeURIComponent(path);
  return '<div class="html-preview" style="margin:8px 0;border:1px solid var(--border);border-radius:8px;overflow:hidden">'
    + '<div style="padding:6px 12px;background:var(--surface2);font-size:12px;color:var(--text2);display:flex;align-items:center;justify-content:space-between">'
    + '<span><i class="fas fa-code mr-1"></i>' + escHtml(displayFileName(path)) + '</span>'
    + '<a href="' + escAttr(url) + '" download style="color:var(--accent);text-decoration:none;font-size:11px"><i class="fas fa-download mr-1"></i>Download</a>'
    + '</div>'
    + '<iframe src="' + escAttr(url) + '" style="width:100%;height:400px;border:none;background:#fff" loading="lazy"></iframe>'
    + '</div>';
}
function renderInlineMarkdown(raw) {
  const tokens = [];
  const stash = (html) => { const id = tokens.push(html) - 1; return '\x00' + id + '\x01'; };
  let text = String(raw ?? '');
  text = text.replace(/`([^`\n]+)`/g, (_m, code) => stash('<code>' + escHtml(code) + '</code>'));
  // Handle preview markers (before download markers so both can coexist)
  text = text.replace(PREVIEW_MARKER_RE, (match, filePath) => {
    const path = String(filePath || '').trim();
    if (!path) return match;
    return stash(previewHtml(path));
  });
  text = replaceDownloadMarkers(text, (filePath, label) => stash(fileLinkHtml(filePath, label)));
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (match, label, hrefRaw) => {
    const href = String(hrefRaw).trim().replace(/^<|>$/g, '').replace(/\s+["'][\s\S]*$/, '');
    if (/^(https?:\/\/|mailto:)/i.test(href)) {
      return stash('<a href="' + escAttr(href) + '" target="_blank" rel="noreferrer">' + renderInlineMarkdown(label) + '</a>');
    }
    return match;
  });
  let html = escHtml(text);
  html = html.replace(/https?:\/\/[^\s<)]+/g, (url) => stash('<a href="' + escAttr(url) + '" target="_blank" rel="noreferrer">' + escHtml(url) + '</a>'));
  html = html.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/_([^_]+)_/g, '<em>$1</em>').replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return html.replace(/\x00(\d+)\x01/g, (_m, id) => tokens[Number(id)] || '');
}

function markdownTableCells(line) {
  const trimmed = String(line ?? '').trim();
  if (!trimmed.includes('|')) return [];
  return trimmed.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
}
function isMarkdownTableRow(line) { return String(line ?? '').trim().startsWith('|') && markdownTableCells(line).length >= 2; }
function isMarkdownTableSeparator(line) { return markdownTableCells(line).every(c => /^:?-{1,}:?$/.test(c)); }
function markdownTableSeparator(n) { return '| ' + Array.from({length:Math.max(2,n)}, () => '---').join(' | ') + ' |'; }
function isInsideOpenFence(text) { let o = false; for (const l of String(text ?? '').split('\n')) { if (/^\s*```/.test(l)) o = !o; } return o; }
function normalizeStreamingMarkdownTables(text) {
  const raw = String(text ?? '');
  if (!raw || isInsideOpenFence(raw)) return raw;
  const lines = raw.split('\n');
  let end = lines.length - 1;
  while (end >= 0 && lines[end] === '') end -= 1;
  if (end < 0 || (!isMarkdownTableRow(lines[end]) && !isMarkdownTableSeparator(lines[end]))) return raw;
  let start = end;
  while (start > 0 && (isMarkdownTableRow(lines[start - 1]) || isMarkdownTableSeparator(lines[start - 1]))) start -= 1;
  if (!isMarkdownTableRow(lines[start])) return raw;
  const hcc = markdownTableCells(lines[start]).length;
  if (hcc < 2) return raw;
  const next = lines[start + 1];
  const r = lines.slice();
  if (next === undefined || !isMarkdownTableSeparator(next)) { r.splice(start + 1, 0, markdownTableSeparator(hcc)); }
  else if (markdownTableCells(next).length < hcc) { r[start + 1] = markdownTableSeparator(hcc); }
  return r.join('\n');
}

function renderMarkdown(text) {
  if (typeof marked === 'undefined') return escHtml(String(text ?? ''));
  const previewTokens = [];
  let raw = String(text ?? '');
  raw = raw.replace(PREVIEW_MARKER_RE, (match, filePath) => {
    const path = String(filePath || '').trim();
    if (!path) return match;
    const id = previewTokens.length;
    previewTokens.push(previewHtml(path));
    return '\x00PREVIEW_' + id + '\x01';
  });
  raw = normalizeStreamingMarkdownTables(replaceDownloadMarkers(raw, (fp, l) => fileLinkHtml(fp, l)));
  const renderer = new marked.Renderer();
  renderer.code = function({ text, lang }) {
    const language = (lang || '').toLowerCase();
    const isHtml = language === 'html' || language === 'htm';
    if (language === 'diff' || language === 'patch') {
      return '<pre class="code-block"><div class="code-header"><span class="code-lang">' + escHtml(lang || 'text') + '</span><button class="code-copy" onclick="copyCodeBlock(this)"><i class="fas fa-copy"></i></button></div><code class="language-' + escAttr(lang || '') + '">' + renderDiffLines(text) + '</code></pre>';
    }
    const escaped = escHtml(text);
    let highlighted = escaped;
    if (typeof hljs !== 'undefined' && language && hljs.getLanguage(language)) {
      try { highlighted = hljs.highlight(text, { language, ignoreIllegals: true }).value; } catch {}
    } else if (typeof hljs !== 'undefined') {
      try { highlighted = hljs.highlightAuto(text).value; } catch {}
    }
    const toggleSwitch = isHtml
      ? '<div class="code-toggle"><button class="toggle-btn active" onclick="toggleCodeMode(this,\'code\')"><i class="fas fa-code"></i> Code</button><button class="toggle-btn" onclick="toggleCodeMode(this,\'preview\')"><i class="fas fa-eye"></i> Preview</button></div>'
      : '';
    return '<pre class="code-block' + (isHtml ? ' has-preview' : '') + '">'
      + '<div class="code-header"><span class="code-lang">' + escHtml(lang || 'auto') + '</span><div class="code-actions">'
      + toggleSwitch
      + '<button class="code-copy" onclick="copyCodeBlock(this)"><i class="fas fa-copy"></i></button>'
      + '</div></div>'
      + '<div class="code-content"><code class="language-' + escAttr(lang || '') + '" data-code="' + escAttr(text) + '">' + highlighted + '</code></div>'
      + (isHtml ? '<div class="preview-content" style="display:none"><iframe style="width:100%;border:none"></iframe></div>' : '')
      + '</pre>';
  };
  renderer.link = function({ href, title, tokens }) {
    const label = this.parser.parseInline(tokens);
    const ta = title ? ' title="' + escAttr(title) + '"' : '';
    if (href && /^(https?:\/\/|mailto:)/i.test(href)) return '<a href="' + escAttr(href) + '"' + ta + ' target="_blank" rel="noreferrer">' + label + '</a>';
    return '<a href="' + escAttr(href || '') + '"' + ta + '>' + label + '</a>';
  };

  let result = marked.parse(raw, { renderer, breaks: false, gfm: true });
  result = result.replace(/\x00PREVIEW_(\d+)\x01/g, (_m, id) => previewTokens[Number(id)] || '');
  return result;
}

}

// ── Running tasks panel ──────────────────────────────────────────────────
// ── Goals sidebar ────────────────────────────────────────────────────────
function updateGoalsSidebar() {
  const goals = [];
  for (const id of state.taskOrder) {
    const t = state.tasks.get(id);
    if (!t) continue;
    if (t.goal) goals.push({ taskId: id, task: t, goal: t.goal });
  }
  if (goals.length === 0) {
    if (emptyGoals) emptyGoals.style.display = '';
    goalsSection.querySelectorAll('.goal-item').forEach(el => el.remove());
    return;
  }
  if (emptyGoals) emptyGoals.style.display = 'none';
  const existing = new Set();
  goalsSection.querySelectorAll('.goal-item').forEach(el => {
    if (!goals.find(g => g.taskId === el.dataset.taskId)) el.remove();
    else existing.add(el.dataset.taskId);
  });
  for (const g of goals) {
    let el = goalsSection.querySelector('[data-task-id="' + g.taskId + '"]');
    if (!el) {
      el = document.createElement('div');
      el.className = 'goal-item';
      el.dataset.taskId = g.taskId;
      goalsSection.appendChild(el);
    }
    const iconCls = 'goal-icon ' + (g.goal.status || 'in_progress');
    const iconText = g.goal.status === 'achieved' ? '\u2713' : g.goal.status === 'failed' ? '\u2717' : '\u25CB';
    el.innerHTML = '<span class="' + iconCls + '">' + iconText + '</span>'
      + '<div><div class="goal-text">' + escHtml(truncate(g.goal.description || g.task.summary || g.task.prompt, 60)) + '</div>'
      + '<div class="goal-task-name">' + escHtml(truncate(g.task.summary || g.taskId.slice(0,8), 30)) + '</div></div>';
    el.addEventListener('click', () => {
      state.activeTaskId = g.taskId;
      document.querySelectorAll('.task-item').forEach(el => el.classList.remove('active'));
      const sidebarTask = taskList.querySelector('[data-task-id="' + g.taskId + '"]');
      if (sidebarTask) sidebarTask.classList.add('active');
      const card = feed.querySelector('[data-task-id="' + g.taskId + '"]');
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }
}

document.addEventListener('click', async (event) => {
  const link = event.target.closest?.('a.file-link');
  if (!link) return;
  event.preventDefault();
  const fallback = displayFileName(link.getAttribute('title') || link.textContent || 'download');
  try {
    const response = await fetch(link.href, { cache: 'no-store' });
    if (!response.ok) {
      let message = 'Download failed (' + response.status + ').';
      try { const data = await response.json(); if (data?.error) message = data.error; } catch {}
      appendSystemMessage(message, true);
      return;
    }
    const blob = await response.blob();
    const name = fileNameFromDisposition(response.headers.get('Content-Disposition'), fallback);
    const objectUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objectUrl; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();

function splitThinking(text) {

  var parts = [], pos = 0;

    var oi = text.indexOf(OPEN, pos);
    if (oi === -1) { parts.push({type:'content', text:text.slice(pos)}); break; }

    var ci = text.indexOf(CLOSE, oi + OPEN.length);
    if (ci === -1) { parts.push({type:'thinking', text:text.slice(oi + OPEN.length), open:true}); break; }
    parts.push({type:'thinking', text:text.slice(oi + OPEN.length, ci), open:false});
    pos = ci + CLOSE.length;
  }
  return parts;
}

}

// ── Model select ──────────────────────────────────────────────────────────
modelSelect.addEventListener('change', async () => {
  const name = modelSelect.value;
  if (!name || name === '\u2014') return;
  try {
    const r = await fetch('/api/model', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name}) });
    const data = await r.json().catch(() => ({}));
    if (r.ok) applyModelPayload(data);
    else appendSystemMessage(data?.error || 'Model switch failed (' + r.status + ').', true);
  } catch (error) { appendSystemMessage(String(error), true); }
});
function providerOf(entry) {
  if (!entry) return 'Other';
  const url = entry.baseUrl || '';
  if (/anthropic/i.test(url)) return 'Anthropic';
  if (/openai/i.test(url)) return 'OpenAI';
  if (entry.backend === 'ollama') return 'Local';
  return 'Other';
}
function populateModelSelect(aliases, current) {
  modelSelect.innerHTML = '';
  const options = Array.from(new Set([current, ...(aliases || [])].filter(Boolean)));
  if (!options.length) { modelSelect.innerHTML = '<option>\u2014</option>'; return; }
  const groups = {};
  options.forEach(a => { const entry = state.modelConfig?.models?.[a] || null; const p = providerOf(entry); (groups[p] = groups[p] || []).push(a); });
  const order = ['Anthropic', 'OpenAI', 'Local', 'Other'];
  order.forEach(p => {
    if (!groups[p]) return;
    const g = document.createElement('optgroup'); g.label = p;
    groups[p].forEach(a => { const opt = document.createElement('option'); opt.value = a; opt.textContent = a; if (a === current) opt.selected = true; g.appendChild(opt); });
    modelSelect.appendChild(g);
  });
}
function applyModelPayload(data) {
  if (!data) return;
  if (data.model) { state.model = data.model; modelLabel.textContent = data.model; }
  if (data.modelAliases) { state.modelAliases = data.modelAliases; populateModelSelect(data.modelAliases, data.model || state.model); }
  const cfg = data.modelConfig || data.config;
  if (cfg) state.modelConfig = cfg;
  if (data.configPath) state.configPath = data.configPath;
  if (data.artifactDir) state.artifactDir = data.artifactDir;
  if (!data.modelAliases && data.model) populateModelSelect(state.modelAliases, data.model);
  populateModelForm(state.model);
}
function currentModelEntry(alias) { return state.modelConfig?.models?.[alias] || null; }
function requestOption(entry, key) { return entry?.requestOptions?.[key] ?? ''; }
function setField(name, value) { const el = modelConfigForm.elements[name]; if (el) el.value = value ?? ''; }
function populateModelForm(alias = state.model) {
  const entry = currentModelEntry(alias);
  setField('alias', alias && alias !== '\u2014' ? alias : '');
  setField('model', entry?.model || (alias && alias !== '\u2014' ? alias : ''));
  setField('backend', entry?.backend || '');
  setField('baseUrl', entry?.baseUrl || '');
  setField('apiKey', '');
  setField('contextWindow', entry?.contextWindow || '');
  setField('temperature', requestOption(entry, 'temperature'));
  setField('topP', requestOption(entry, 'topP'));
  setField('maxTokens', requestOption(entry, 'maxTokens'));
  setField('artifactsDir', state.modelConfig?.artifactsDir || '');
  setField('extraBody', entry?.requestOptions?.extraBody ? JSON.stringify(entry.requestOptions.extraBody, null, 2) : '');
  modelConfigForm.elements.select.checked = true;
  modelConfigError.textContent = '';
}
function openModelConfig() { populateModelForm(modelSelect.value || state.model); modelConfigModal.classList.add('visible'); modelConfigModal.setAttribute('aria-hidden', 'false'); setTimeout(() => modelConfigForm.elements.alias?.focus(), 0); }
function closeModelConfig() { modelConfigModal.classList.remove('visible'); modelConfigModal.setAttribute('aria-hidden', 'true'); modelConfigError.textContent = ''; promptInput.focus(); }
function readModelForm() {
  const form = modelConfigForm.elements;
  return { alias: form.alias.value.trim(), model: form.model.value.trim(), backend: form.backend.value, baseUrl: form.baseUrl.value.trim(), apiKey: form.apiKey.value.trim(), contextWindow: form.contextWindow.value, temperature: form.temperature.value, topP: form.topP.value, maxTokens: form.maxTokens.value, artifactsDir: form.artifactsDir.value.trim(), extraBody: form.extraBody.value.trim(), select: form.select.checked };
}
async function saveModelConfig() {
  modelConfigError.textContent = '';
  const payload = readModelForm();
  if (!payload.alias || !payload.model) { modelConfigError.textContent = 'Alias and model are required.'; return; }
  if (payload.extraBody) { try { JSON.parse(payload.extraBody); } catch { modelConfigError.textContent = 'Extra body must be valid JSON.'; return; } }
  modelConfigSave.disabled = true;
  try {
    const r = await fetch('/api/models', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const data = await r.json();
    if (!r.ok) { modelConfigError.textContent = data?.error || 'Save failed (' + r.status + ').'; return; }
    applyModelPayload(data); closeModelConfig();
  } catch (error) { modelConfigError.textContent = String(error); } finally { modelConfigSave.disabled = false; }
}
modelConfigBtn.addEventListener('click', openModelConfig);
modelConfigClose.addEventListener('click', closeModelConfig);
modelConfigCancel.addEventListener('click', closeModelConfig);
modelConfigSave.addEventListener('click', saveModelConfig);
modelConfigModal.addEventListener('click', (event) => { if (event.target === modelConfigModal) closeModelConfig(); });
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && modelConfigModal.classList.contains('visible')) closeModelConfig();
  if (event.key === 'Tab' && event.shiftKey && !modelConfigModal.classList.contains('visible')) { event.preventDefault(); cycleMode(); }
});

// ── Send prompt ───────────────────────────────────────────────────────────
let typingIndicator = null;
function showTypingIndicator() {
  if (typingIndicator) return;
  typingIndicator = makeMsgRow('master','...', 'Agent', 'master-label', new Date().toISOString(), '<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>');
  appendToFeed(typingIndicator);
}
function hideTypingIndicator() {
  if (typingIndicator) { typingIndicator.remove(); typingIndicator = null; }
}
async function sendPrompt() {
  const text = promptInput.value.trim();
  if (!text) return;
  promptInput.value = '';
  promptInput.style.height = '';
  sendBtn.disabled = true;
  const row = makeMsgRow('user','U','You','user-label', new Date().toISOString(), renderMarkdown(text));
  appendToFeed(row);
  showTypingIndicator();
  try {
    const r = await fetch('/api/prompt', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, mode: state.mode }) });
    if (!r.ok) { hideTypingIndicator(); const data = await r.json().catch(() => ({})); appendSystemMessage(data?.error || 'Prompt failed (' + r.status + ').', true); }
  } catch { hideTypingIndicator(); appendSystemMessage('Network error.', true); }
  finally { sendBtn.disabled = false; }
}
sendBtn.addEventListener('click', sendPrompt);
promptInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); void sendPrompt(); } });
promptInput.addEventListener('input', () => { promptInput.style.height = 'auto'; promptInput.style.height = Math.min(promptInput.scrollHeight, 160) + 'px'; });

// ── SSE event handler ─────────────────────────────────────────────────────
function handleEvent(msg) {
  const { channel, event, tasks, mode, model, modelAliases } = msg;
  if (channel === 'snapshot') {
    if (mode) setMode(mode);
    applyModelPayload(msg);
    (tasks || []).forEach(t => hydrateTask(t));
    updateGoalsSidebar();
    return;
  }
  if (channel === 'model_changed') { applyModelPayload({ model: msg.model, modelAliases: msg.modelAliases, modelConfig: msg.modelConfig, artifactDir: msg.artifactDir }); return; }
  if (channel === 'mode_changed') { setMode(msg.mode); return; }
  if (channel === 'user_message') return;
  if (!event) return;
  hideTypingIndicator();
  switch (event.type) {
    case 'task_created': {
      const task = event.task;
      if (task.taskId === '__system__') return;
      if (state.tasks.has(task.taskId)) break;
      state.tasks.set(task.taskId, task);
      state.taskOrder.push(task.taskId);
      emptySidebar.style.display = 'none';
      const node = makeTaskNode(task);
      appendToFeed(node);
      const li = makeSidebarItem(task);
      taskList.appendChild(li);
      updateGoalsSidebar();
      break;
    }
    case 'task_updated': {
      const task = event.task;
      if (task.taskId === '__system__') return;
      state.tasks.set(task.taskId, task);
      updateTaskCard(task.taskId, { status: task.status, title: task.summary || task.prompt });
      updateTaskGoalBadge(task.taskId, visibleTaskGoal(task));
      updateTaskTodos(task.taskId, task.todos || []);
      setTaskClarifications(task.taskId, task.pendingClarifications || []);
      updateSidebarItem(task.taskId, task.status, event.ts);
      updateGoalsSidebar();
      break;
    }
    case 'master_response': break;
    case 'user_visible_message': {
      const task = event.taskId ? state.tasks.get(event.taskId) : null;
      const label = taskAgentLabel(task, 'Agent');
      const row = document.createElement('div');
      row.className = 'msg-row';
      row.innerHTML = '<div class="msg-avatar master">P</div>'
        + '<div class="msg-body"><div class="msg-header">'
        + '<span class="msg-from master-label">' + escHtml(label) + '</span>'
        + '<span class="msg-ts">' + fmtTime(event.ts) + '</span></div>'
        + '<div class="msg-text md"></div></div>';
      appendToFeed(row);
      const textEl = row.querySelector('.msg-text');
      requestAnimationFrame(() => { textEl.innerHTML = renderMarkdown(event.text); scrollToBottom(); });
      break;
    }
    case 'task_phase': { updatePhaseBar(event.taskId, event.phase, event.status, event.note); break; }
    case 'task_output': { appendStreamToCard(event.taskId, event.text); break; }
    case 'tool_call': { upsertToolCall(event.taskId, event.tool, event.input, undefined); break; }
    case 'tool_result': { upsertToolCall(event.taskId, event.tool, '', event.output); break; }
    case 'task_mailbox_updated': {
      const mb = event.message;
      const els = taskEls.get(event.taskId);
      if (els) {
        const mbox = document.createElement('div');
        mbox.className = 'mailbox-msg';
        mbox.innerHTML = '<div class="mailbox-from">mailbox from ' + escHtml(mb.sourceTaskId||'master') + '</div><div class="msg-text md">' + renderMarkdown(mb.text||'') + '</div>';
        els.card.insertBefore(mbox, els.streamEl);
        scrollToBottom();
      }
      break;
    }
    case 'writer_patch_submitted':
    case 'writer_patch_applied':
    case 'writer_patch_verified':
    case 'writer_conflict':
    case 'writer_failed': {
      const els = taskEls.get(event.taskId);
      if (els) {
        const patch = event.patch || {};
        let item = null;
        if (patch.patchId) item = Array.from(els.card.querySelectorAll('[data-patch-id]')).find(el => el.dataset.patchId === patch.patchId);
        if (!item) { item = document.createElement('div'); item.className = 'mailbox-msg'; if (patch.patchId) item.dataset.patchId = patch.patchId; els.card.insertBefore(item, els.streamEl); }
        const label = event.type.replace('writer_', '').replaceAll('_', ' ');
        const detail = event.error || patch.result || patch.summary || '';
        const diff = patchDiffMarkdown(patch);
        item.innerHTML = '<div class="mailbox-from">writer ' + escHtml(label) + '</div><div class="msg-text md">' + renderMarkdown([detail, diff].filter(Boolean).join('\n\n')) + '</div>';
        scrollToBottom();
      }
      break;
    }
    case 'subagent_created':
    case 'subagent_updated': {
      const sub = event.subagent;
      const els = taskEls.get(sub.parentTaskId);
      if (els) {
        const subId = sub.subagentId || sub.taskId;
        const id = 'subagent-' + subId;
        let subEl = els.card.querySelector('#' + id);
        if (!subEl) { subEl = document.createElement('div'); subEl.id = id; subEl.style.cssText = 'margin:3px 16px;padding:4px 10px;border-left:2px solid var(--accent);border-radius:0 6px 6px 0;font-size:11.5px;color:var(--text-muted);background:var(--accent-glow)'; els.card.insertBefore(subEl, els.streamEl); scrollToBottom(); }
        subEl.textContent = 'subagent ' + subId.slice(0,8) + ' - ' + sub.status;
      }
      break;
    }
    case 'subagent_output': { const els = taskEls.get(event.parentTaskId); if (els) appendStreamToCard(event.parentTaskId, event.text); break; }
    case 'clarification_requested': { showClarification({ taskId: event.taskId, clarificationId: event.clarification.clarificationId, question: event.clarification.question, choices: event.clarification.choices || [] }); break; }
    case 'clarification_answered': { hideClarification(event.taskId, event.clarificationId); break; }
    case 'todo_updated': { const task = state.tasks.get(event.taskId); if (task) { task.todos = event.todos; updateTaskTodos(event.taskId, event.todos); } break; }
    case 'goal_status_changed': { const task = state.tasks.get(event.taskId); if (task) { task.goal = event.goal; updateTaskGoalBadge(event.taskId, event.goal); updateGoalsSidebar(); } break; }
    case 'task_done': {
      const task = state.tasks.get(event.taskId);
      if (task) task.status = event.status;
      updateTaskCard(event.taskId, { status: event.status });
      updateTaskGoalBadge(event.taskId, visibleTaskGoal(task));
      const els = taskEls.get(event.taskId);
      if (event.result && els && !(els.streamText || '').trim()) setTaskNodeOutput(event.taskId, event.result);
      if (els && els.card.classList.contains('expanded')) {
        setTimeout(() => els.card.classList.remove('expanded'), 2000);
      }
      updateSidebarItem(event.taskId, event.status, event.ts);
      updateGoalsSidebar();
      break;
    }
  }
}

function hydrateTask(task) {
  if (task.taskId === '__system__') return;
  if (state.tasks.has(task.taskId)) return;
  state.tasks.set(task.taskId, task);
  state.taskOrder.push(task.taskId);
  emptySidebar.style.display = 'none';
  const node = makeTaskNode(task);
  appendToFeed(node);
  const li = makeSidebarItem(task);
  taskList.appendChild(li);
  updateTaskTodos(task.taskId, task.todos || []);
  setTaskClarifications(task.taskId, task.pendingClarifications || []);
  if (task.goal) updateTaskGoalBadge(task.taskId, task.goal);
  (task.visibleMessages || []).forEach(message => {
    const row = makeMsgRow('master','P',taskAgentLabel(task, 'Agent'), 'master-label', message.ts, renderMarkdown(message.text));
    appendToFeed(row);
  });
}

// ── SSE connection ────────────────────────────────────────────────────────
let sse = null;
let reconnectTimer = null;
function connect() {
  if (sse) { try { sse.close(); } catch {} }
  sse = new EventSource('/api/events');
  sse.onopen = () => { if (connDot) connDot.className = 'connected'; clearTimeout(reconnectTimer); };
  sse.onmessage = (e) => { try { handleEvent(JSON.parse(e.data)); } catch {} };
  sse.onerror = () => { if (connDot) connDot.className = 'disconnected'; sse.close(); reconnectTimer = setTimeout(connect, 2500); };
}

// ── Theme toggle ───────────────────────────────────────────────────────────
const themeBtn = document.getElementById('theme-toggle');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  if (themeBtn) themeBtn.textContent = t === 'light' ? '\u2600' : '\uD83C\uDF19';
  const hljsLink = document.getElementById('hljs-theme');
  if (hljsLink) {
    hljsLink.href = t === 'light'
      ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css'
      : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css';
  }
  try { localStorage.setItem('theme', t); } catch {}
}
if (themeBtn) themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  applyTheme(next);
});
applyTheme(localStorage.getItem('theme') || 'dark');

// ── Init ──────────────────────────────────────────────────────────────────
(async () => {
  try {
    const r = await fetch('/api/state');
    const data = await r.json();
    if (data.mode) setMode(data.mode);
    applyModelPayload(data);

    // Collect all items (tasks + messages) and sort by timestamp for correct ordering
    const items = [];
    (data.tasks || []).forEach(task => {
      if (task.taskId === '__system__') return;
      state.tasks.set(task.taskId, task);
      state.taskOrder.push(task.taskId);
      items.push({ type: 'task', ts: task.updatedAt || task.createdAt || '', task });
    });
    (data.messages || []).forEach(msg => {
      items.push({ type: 'message', ts: msg.ts || '', msg });
    });
    items.sort((a, b) => (a.ts || '').localeCompare(b.ts || ''));

    if (items.length) emptySidebar.style.display = 'none';
    items.forEach(item => {
      if (item.type === 'task') {
        const task = item.task;
        const node = makeTaskNode(task);
        appendToFeed(node);
        const li = makeSidebarItem(task);
        taskList.appendChild(li);
        updateTaskTodos(task.taskId, task.todos || []);
        setTaskClarifications(task.taskId, task.pendingClarifications || []);
        if (task.goal) updateTaskGoalBadge(task.taskId, task.goal);
        (task.visibleMessages || []).forEach(message => {
          const row = makeMsgRow('master','P',taskAgentLabel(task, 'Agent'), 'master-label', message.ts, renderMarkdown(message.text));
          appendToFeed(row);
        });
      } else {
        const msg = item.msg;
        const ts = msg.ts || new Date().toISOString();
        if (msg.role === 'user') {
          const row = makeMsgRow('user','U','You','user-label', ts, renderMarkdown(msg.content));
          appendToFeed(row);
        } else if (msg.role === 'assistant') {
          const row = makeMsgRow('master','P','Agent','master-label', ts, renderMarkdown(msg.content));
          appendToFeed(row);
        }
      }
    });
    updateGoalsSidebar();
  } catch {}
  connect();
})();
</script>
