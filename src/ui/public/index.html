<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coder — Multi-Agent Web UI</title>
<style>
/* ── Reset + base ───────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:           #0b1117;
  --surface:      #111921;
  --surface2:     #18232f;
  --surface3:     #1e2e3e;
  --border:       #243040;
  --border-soft:  #1c2a38;
  --text:         #d7e0ea;
  --text-muted:   #6b8099;
  --text-soft:    #95aabf;
  --accent:       #5ba3c9;
  --accent-hi:    #79bfe0;
  --plan-accent:  #c87dc0;
  --success:      #6daa7f;
  --warning:      #c9a050;
  --danger:       #c07070;
  --running:      #5ba3c9;
  --tool-bg:      #0d1a26;
  --radius:       6px;
  --radius-lg:    8px;
  --font-mono:    'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
  --font-sans:    'Inter', system-ui, sans-serif;
  --sidebar-w:    260px;
}
[data-theme="light"] {
  --bg:           #f5f7fa;
  --surface:      #ffffff;
  --surface2:     #edf0f4;
  --surface3:     #dde3ea;
  --border:       #c8d0da;
  --border-soft:  #d8dfe8;
  --text:         #1a2332;
  --text-muted:   #6b7a8d;
  --text-soft:    #4a5568;
  --accent:       #2b7cad;
  --accent-hi:    #1a6a9e;
  --plan-accent:  #9b4d94;
  --success:      #2d8a4e;
  --warning:      #9a7a20;
  --danger:       #b04040;
  --running:      #2b7cad;
  --tool-bg:      #f0f2f5;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13.5px;
  line-height: 1.55;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
a { color: var(--accent); text-decoration: none; }
button { cursor: pointer; border: none; background: none; color: inherit; font: inherit; }
input, textarea, select {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  outline: none;
  transition: border-color .15s;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
code, pre { font-family: var(--font-mono); }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

/* ── Layout ─────────────────────────────────────────────────────────────── */
#app { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ────────────────────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#sidebar-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border-soft);
  display: flex;
  align-items: center;
  gap: 8px;
}
#sidebar-header .logo { font-size: 17px; font-weight: 700; letter-spacing: -.3px; color: var(--text); }
#logo-dot { transition: color .3s; }
#logo-dot.disconnected { color: var(--danger); }
#logo-dot.connecting { color: var(--warning); }
#logo-dot.connected { color: var(--success); }
#sidebar-header .ver { font-size: 11px; color: var(--text-muted); margin-left: auto; }

.section-label {
  padding: 10px 16px 4px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text-muted);
}

#task-list { flex: 1; overflow-y: auto; padding: 4px 0; }

.task-item {
  padding: 7px 16px;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  border-left: 2px solid transparent;
  transition: background .1s, border-color .1s;
  user-select: none;
}
.task-item:hover { background: var(--surface2); }
.task-item.active { background: var(--surface2); border-left-color: var(--accent); }
.task-item .task-icon { flex-shrink: 0; margin-top: 1px; font-size: 12px; }
.task-item .task-meta { min-width: 0; flex: 1; }
.task-item .task-title { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-soft); }
.task-item.active .task-title { color: var(--text); }
.task-item .task-status { font-size: 10.5px; color: var(--text-muted); }
.task-item .task-time { font-size: 10px; color: var(--text-muted); margin-top: 1px; }

.mode-row {
  position: relative;
  flex-shrink: 0;
}
.mode-trigger {
  padding: 0 12px;
  height: 40px;
  min-width: 56px;
  border-radius: var(--radius-lg);
  font-size: 12px;
  font-weight: 600;
  color: var(--accent-hi);
  background: var(--surface3);
  border: 1px solid var(--accent);
  transition: color .15s, border-color .15s, background .15s;
  cursor: pointer;
  white-space: nowrap;
}
.mode-trigger:hover { border-color: var(--accent-hi); }
.mode-dropdown {
  display: none;
  position: absolute;
  bottom: calc(100% + 4px);
  left: 0;
  min-width: 120px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  z-index: 100;
}
.mode-dropdown.open { display: block; }
.mode-dropdown button {
  display: block;
  width: 100%;
  padding: 7px 10px;
  border: none;
  background: none;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-soft);
  text-align: left;
  cursor: pointer;
}
.mode-dropdown button:hover { background: var(--surface3); color: var(--text); }
.mode-dropdown button.active { color: var(--accent-hi); background: var(--surface3); }
.mode-dropdown button .mode-hint {
  float: right;
  font-size: 10px;
  color: var(--text-muted);
}

.model-row {
  display: flex; align-items: center; gap: 6px;
}
#model-select {
  flex: 1;
  padding: 3px 6px;
  font-size: 11.5px;
  border-radius: var(--radius);
  height: 26px;
  min-width: 0;
}
#model-select optgroup { color: var(--text-muted); font-size: 10.5px; font-style: normal; }
#model-select option { color: var(--text); }
#sidebar-footer {
  border-top: 1px solid var(--border-soft);
  padding: 10px 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
#sidebar-footer #model-select {
  width: 100%;
  padding: 4px 6px;
  font-size: 11.5px;
  border-radius: var(--radius);
  height: 28px;
}
#sidebar-footer #model-config-btn {
  width: 100%;
  height: 28px;
  padding: 0 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text-soft);
  font-size: 11.5px;
  flex-shrink: 0;
}
#sidebar-footer #model-config-btn:hover { border-color: var(--accent); color: var(--accent-hi); }
#theme-toggle {
  height: 28px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface2);
  cursor: pointer;
  line-height: 1;
}
#theme-toggle:hover { border-color: var(--accent); }

/* ── Main panel ─────────────────────────────────────────────────────────── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* ── Feed / timeline ────────────────────────────────────────────────────── */
#feed {
  flex: 1;
  overflow-y: auto;
  padding: 16px 0;
}

/* ── Message row ────────────────────────────────────────────────────────── */
.msg-row {
  display: flex;
  gap: 10px;
  padding: 6px 20px 6px 16px;
  align-items: flex-start;
  animation: fadeIn .18s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.msg-row:hover { background: var(--surface2); }

.msg-avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
  margin-top: 1px;
}
.msg-avatar.user    { background: var(--surface3); color: var(--accent-hi); }
.msg-avatar.master  { background: var(--surface3); color: #b88ee0; }
.msg-avatar.task    { background: var(--surface3); color: var(--accent); }
.msg-avatar.tool    { background: var(--surface3); color: var(--success); }
.msg-avatar.warn    { background: var(--surface3); color: var(--warning); }

.msg-body { flex: 1; min-width: 0; }
.msg-header {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 2px;
}
.msg-from { font-size: 12px; font-weight: 600; color: var(--text-soft); }
.msg-from.master-label { color: #b88ee0; }
.msg-from.user-label { color: var(--accent); }
.msg-ts { font-size: 10.5px; color: var(--text-muted); }

.msg-text {
  color: var(--text);
  font-size: 13px;
  line-height: 1.6;
  word-break: break-word;
  white-space: pre-wrap;
}
.msg-text.md { white-space: normal; }
.msg-text.md p,
.stream-block.md p { margin: 0 0 8px; }
.msg-text.md p:last-child,
.stream-block.md p:last-child { margin-bottom: 0; }
.msg-text.md h1,
.msg-text.md h2,
.msg-text.md h3,
.stream-block.md h1,
.stream-block.md h2,
.stream-block.md h3 {
  margin: 10px 0 5px;
  line-height: 1.25;
  color: var(--text);
  font-weight: 700;
}
.msg-text.md h1,
.stream-block.md h1 { font-size: 16px; }
.msg-text.md h2,
.stream-block.md h2 { font-size: 14.5px; }
.msg-text.md h3,
.stream-block.md h3 { font-size: 13.5px; }
.msg-text.md ul,
.msg-text.md ol,
.stream-block.md ul,
.stream-block.md ol {
  padding-left: 22px;
  margin: 4px 0 8px;
}
.msg-text.md li,
.stream-block.md li { margin: 2px 0; }
.msg-text.md blockquote,
.stream-block.md blockquote {
  margin: 6px 0 8px;
  padding: 4px 0 4px 10px;
  border-left: 2px solid var(--border);
  color: var(--text-soft);
}
.msg-text.md pre,
.stream-block.md pre {
  margin: 6px 0 8px;
  padding: 8px 10px;
  overflow-x: auto;
  white-space: pre;
  background: var(--tool-bg);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
}
.msg-text.md code,
.stream-block.md code {
  font-family: var(--font-mono);
  font-size: .92em;
  background: var(--surface3);
  border: 1px solid var(--border-soft);
  border-radius: 4px;
  padding: 1px 4px;
}
.msg-text.md pre code,
.stream-block.md pre code {
  display: block;
  padding: 0;
  background: transparent;
  border: none;
  border-radius: 0;
  color: var(--code-text, var(--text));
}
.diff-line {
  display: block;
  min-height: 1.45em;
  padding: 0 6px;
  margin: 0 -4px;
  white-space: pre;
}
.diff-add {
  color: #9fcca7;
  background: rgba(109,170,127,.09);
}
.diff-del {
  color: #d58a8a;
  background: rgba(192,112,112,.1);
}
.diff-hunk {
  color: var(--accent-hi);
  background: rgba(91,163,201,.08);
}
.diff-file {
  color: var(--text-soft);
  font-weight: 600;
}
.msg-text.md a,
.stream-block.md a { color: var(--accent-hi); text-decoration: underline; text-underline-offset: 2px; }
.msg-text.md a.file-link,
.stream-block.md a.file-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  max-width: 100%;
  padding: 1px 7px;
  border: 1px solid rgba(91,163,201,.35);
  border-radius: 999px;
  background: rgba(91,163,201,.09);
  text-decoration: none;
  vertical-align: baseline;
}
.msg-text.md a.file-link code,
.stream-block.md a.file-link code {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  background: transparent;
  border: none;
  padding: 0;
}

/* ── Markdown tables ────────────────────────────────────────────────────── */
.msg-text.md table,
.stream-block.md table {
  border-collapse: collapse;
  margin: 8px 0;
  width: 100%;
  font-size: 12.5px;
}
.msg-text.md th, .stream-block.md th,
.msg-text.md td, .stream-block.md td {
  padding: 5px 10px;
  border: 1px solid var(--border-soft);
  white-space: nowrap;
}
.msg-text.md th, .stream-block.md th {
  background: var(--surface3);
  font-weight: 600;
  color: var(--text);
}
.msg-text.md td, .stream-block.md td {
  color: var(--text-soft);
}
.msg-text.md tr:hover td,
.stream-block.md tr:hover td {
  background: var(--surface2);
}

/* ── Task header card ───────────────────────────────────────────────────── */
.task-card {
  margin: 10px 16px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.task-card-header {
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border-soft);
  background: var(--surface2);
}
.task-card-header .task-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .04em;
  padding: 2px 7px;
  border-radius: 99px;
  text-transform: uppercase;
}
.task-card-header .task-badge.worker { background: var(--surface3); color: var(--accent); }
.task-card-header .task-badge.inquiry { background: var(--surface3); color: #b88ee0; }
.task-card-header .task-badge.plan-mode { background: var(--surface3); color: #d090d8; }
.task-card-id { font-size: 10.5px; color: var(--text-muted); font-family: var(--font-mono); }
.task-card-title { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-status-pill {
  font-size: 10.5px;
  padding: 2px 8px;
  border-radius: 99px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .03em;
  flex-shrink: 0;
}

/* ── Phase bar ──────────────────────────────────────────────────────────── */
.phase-bar {
  padding: 6px 14px;
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  background: var(--surface);
}
.phase-dot {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 10.5px;
  font-weight: 500;
  background: var(--surface3);
  color: var(--text-muted);
  border: 1px solid transparent;
}
.phase-dot.active { background: var(--surface3); border-color: var(--accent); color: var(--accent-hi); }
.phase-dot.done   { background: var(--surface3); border-color: var(--success); color: var(--success); }
.phase-dot.failed { background: var(--surface3); border-color: var(--danger);  color: var(--danger);  }
.phase-dot .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.phase-dot.active .dot { animation: pulse .9s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

/* ── Stream / output block ──────────────────────────────────────────────── */
.stream-block {
  margin: 0 14px 0;
  padding: 8px 10px;
  background: var(--tool-bg);
  border-left: 2px solid var(--border);
  border-radius: 0 var(--radius) var(--radius) 0;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-soft);
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 280px;
  overflow-y: auto;
}
.stream-block.md {
  font-family: var(--font-sans);
  white-space: normal;
  word-break: break-word;
}

/* ── Thinking block ─────────────────────────────────────────────────────── */
.thinking-block {
  margin: 4px 0 8px;
  border-left: 2px solid var(--text-muted);
  border-radius: 0 var(--radius) var(--radius) 0;
  background: rgba(107,128,153,.06);
  overflow: hidden;
}
.thinking-header {
  padding: 5px 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: 11.5px;
  color: var(--text-muted);
  user-select: none;
}
.thinking-header:hover { background: rgba(107,128,153,.08); }
.thinking-arrow {
  font-size: 10px;
  transition: transform .15s;
  display: inline-block;
}
.thinking-block.open .thinking-arrow { transform: rotate(-90deg); }
.thinking-label { font-weight: 500; }
.thinking-body {
  display: none;
  padding: 4px 10px 8px;
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.5;
  max-height: 200px;
  overflow-y: auto;
  font-style: italic;
}
.thinking-block.open .thinking-body { display: block; }

/* ── Goal + Todo ─────────────────────────────────────────────────────────── */
.goal-badge {
  display: inline-block;
  font-size: 10.5px;
  padding: 1px 8px;
  border-radius: 99px;
  margin-left: auto;
  font-weight: 600;
}
.goal-in_progress { background: var(--surface3); color: var(--accent); border: 1px solid var(--accent); }
.goal-achieved { background: rgba(109,170,127,.12); color: var(--success); border: 1px solid var(--success); }
.goal-failed { background: rgba(192,112,112,.12); color: var(--danger); border: 1px solid var(--danger); }

.task-todos {
  margin: 4px 14px 6px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.todo-item {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  font-size: 12px;
  padding: 3px 8px;
  border-radius: var(--radius);
  background: var(--surface2);
}
.todo-check { flex-shrink: 0; font-size: 13px; line-height: 1.3; }
.todo-done .todo-text { text-decoration: line-through; color: var(--text-muted); }
.todo-active .todo-check { color: var(--accent); }
.todo-active .todo-text { color: var(--text); }
.todo-pending .todo-text { color: var(--text-soft); }

/* ── Tool call collapsible ──────────────────────────────────────────────── */
.tool-call {
  margin: 4px 14px;
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  background: var(--tool-bg);
  overflow: hidden;
}
.tool-call-header {
  padding: 6px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 12px;
  user-select: none;
}
.tool-call-header:hover { background: var(--surface3); }
.tool-name { font-family: var(--font-mono); font-size: 11.5px; color: var(--success); font-weight: 600; }
.tool-chevron { margin-left: auto; font-size: 10px; color: var(--text-muted); transition: transform .15s; }
.tool-call.open .tool-chevron { transform: rotate(90deg); }
.tool-body { display: none; }
.tool-call.open .tool-body { display: block; }
.tool-io {
  padding: 6px 10px 8px;
  border-top: 1px solid var(--border-soft);
}
.tool-io-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 3px; }
.tool-io pre {
  font-size: 11.5px;
  color: var(--text-soft);
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 160px;
  overflow-y: auto;
  line-height: 1.5;
}
.tool-output-body {
  font-size: 11.5px;
  color: var(--text-soft);
  max-height: 220px;
  overflow-y: auto;
  line-height: 1.5;
}
.tool-output-body pre {
  margin: 0;
  max-height: none;
}

/* ── Mailbox message ────────────────────────────────────────────────────── */
.mailbox-msg {
  margin: 4px 14px;
  padding: 5px 10px;
  border-left: 2px solid var(--plan-accent);
  background: rgba(200,125,192,.06);
  font-size: 12px;
  color: var(--text-soft);
  border-radius: 0 var(--radius) var(--radius) 0;
}
.mailbox-from { font-size: 10.5px; color: var(--plan-accent); margin-bottom: 2px; }

/* ── Clarification panel ────────────────────────────────────────────────── */
#clarification-bar {
  display: none;
  background: var(--surface2);
  border-top: 1px solid var(--warning);
  padding: 10px 16px;
  gap: 10px;
  align-items: flex-start;
}
#clarification-bar.visible { display: flex; }
.clarify-question { flex: 1; font-size: 13px; color: var(--warning); line-height: 1.5; }
.clarify-question .cq-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 4px; opacity: .7; }
.clarify-choices { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.clarify-choice-btn {
  padding: 4px 10px;
  border-radius: 99px;
  border: 1px solid var(--warning);
  color: var(--warning);
  font-size: 12px;
  background: transparent;
  cursor: pointer;
  transition: background .1s;
}
.clarify-choice-btn:hover { background: rgba(201,160,80,.12); }

/* ── Input bar ──────────────────────────────────────────────────────────── */
#input-bar {
  border-top: 1px solid var(--border);
  background: var(--surface);
  padding: 10px 16px 12px;
  display: flex;

<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<script>
// ── State ─────────────────────────────────────────────────────────────────
const state = {
  tasks: new Map(),        // taskId → task object
  taskOrder: [],           // ordered list of taskIds (excluding __system__)
  activeTaskId: null,
  mode: 'build',
  model: '—',
  modelAliases: [],
  modelConfig: null,
  configPath: '',
  artifactDir: '',
  pendingClarification: null, // { taskId, clarificationId, question, choices }
  atBottom: true,
};

// Tool call state per taskId: Map<taskId, Map<toolKey, {input,output}>>
const toolState = new Map();

// Phase state per taskId
const phaseState = new Map();

// DOM element refs per task for live updates
const taskEls = new Map(); // taskId → { card, statusPill, phaseBar, streamEl, streamText }

// ── DOM refs ─────────────────────────────────────────────────────────────
const feed           = document.getElementById('feed');
const taskList       = document.getElementById('task-list');
const emptySidebar   = document.getElementById('empty-sidebar');
const emptyState     = document.getElementById('empty-state');
const connDot         = document.getElementById('logo-dot');
const modelLabel     = document.getElementById('model-label');
const modelSelect    = document.getElementById('model-select');
const modelConfigBtn = document.getElementById('model-config-btn');
const modelConfigModal = document.getElementById('model-config-modal');
const modelConfigForm = document.getElementById('model-config-form');
const modelConfigClose = document.getElementById('model-config-close');
const modelConfigCancel = document.getElementById('model-config-cancel');
const modelConfigSave = document.getElementById('model-config-save');
const modelConfigError = document.getElementById('model-config-error');
const modeTrigger    = document.getElementById('mode-trigger');
const modeDropdown   = document.getElementById('mode-dropdown');
const modeOptions    = modeDropdown ? modeDropdown.querySelectorAll('button[data-mode]') : [];
const promptInput    = document.getElementById('prompt-input');
const sendBtn        = document.getElementById('send-btn');
const clarBar        = document.getElementById('clarification-bar');
const clarText       = document.getElementById('clarify-text');
const clarChoices    = document.getElementById('clarify-choices');
const scrollBtn      = document.getElementById('scroll-btn');

// ── Utilities ─────────────────────────────────────────────────────────────
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return isNaN(d) ? '' : d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
function truncate(s, n=80) { return s && s.length > n ? s.slice(0,n-1)+'…' : (s||''); }
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return escHtml(s).replace(/'/g,'&#39;');
}
function diffClass(line) {
  if (/^(diff --git|index |--- |\+\+\+ )/.test(line)) return 'diff-file';
  if (line.startsWith('@@')) return 'diff-hunk';
  if (line.startsWith('+') && !line.startsWith('+++')) return 'diff-add';
  if (line.startsWith('-') && !line.startsWith('---')) return 'diff-del';
  return '';
}
function renderDiffLines(text) {
  return String(text ?? '').split('\n').map(line => {
    const cls = diffClass(line);
    return `<span class="diff-line ${cls}">${escHtml(line) || ' '}</span>`;
  }).join('');
}
function patchDiffMarkdown(patch) {
  return (patch?.files || [])
    .map(file => file.diff || (file.path ? `Changed ${file.path}` : ''))
    .filter(Boolean)
    .join('\n\n');
}
function looksLikeDiff(text) {
  return /(^|\n)(diff --git|@@ |--- |\+\+\+ |[+-][^\n]*)/.test(String(text ?? ''));
}
function displayFileName(filePath) {
  const normalized = normalizeLocalFilePath(filePath).replace(/[?#].*$/, '');
  const parts = normalized.split(/[\\/]+/).filter(Boolean);
  return parts.at(-1) || 'download';
}
const FILE_EXT_PATTERN = '(?:pptx?|pdf|docx?|xlsx?|csv|zip|tar\\.gz|png|jpe?g|gif|webp|svg|html?|md|txt|json)';
const FILE_EXT_RE = new RegExp('\\.(' + FILE_EXT_PATTERN + ')$', 'i');
const AUTO_FILE_RE = new RegExp('(^|[\\s([{\'"])((?:file://)?(?:~/|/|\\.{1,2}/)?[A-Za-z0-9_@%+./~-]+\\.' + FILE_EXT_PATTERN + ')(?![A-Za-z0-9_@%+.-])', 'gi');
function normalizeLocalFilePath(value) {
  const raw = String(value || '').trim().replace(/^<|>$/g, '');
  if (!raw) return '';
  if (raw.startsWith('file://')) {
    try { return decodeURIComponent(raw.slice('file://'.length)); } catch { return raw.slice('file://'.length); }
  }
  return raw;
}
function looksLikeDownloadableFile(value) {
  const path = normalizeLocalFilePath(value);
  return Boolean(path) && FILE_EXT_RE.test(path) && !/^[a-z][a-z0-9+.-]*:/i.test(path);
}
function downloadHref(filePath) {
  return '/api/download?path=' + encodeURIComponent(normalizeLocalFilePath(filePath));
}
function fileLinkHtml(filePath, label) {
  const path = normalizeLocalFilePath(filePath);
  const text = displayFileName(path || label);
  return `<a class="file-link" href="${escAttr(downloadHref(path))}" download title="${escAttr(path)}"><span>Download</span><code>${escHtml(text)}</code></a>`;
}
function renderInlineMarkdown(raw) {
  const tokens = [];
  const stash = (html) => {
    const id = tokens.push(html) - 1;
    return `\uE000${id}\uE001`;
  };
  let text = String(raw ?? '');

  text = text.replace(/`([^`\n]+)`/g, (_m, code) => {
    const trimmed = code.trim();
    if (looksLikeDownloadableFile(trimmed)) return stash(fileLinkHtml(trimmed, trimmed));
    return stash(`<code>${escHtml(code)}</code>`);
  });

  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (match, label, hrefRaw) => {
    const href = String(hrefRaw).trim().replace(/^<|>$/g, '').replace(/\s+["'][\s\S]*$/, '');
    if (looksLikeDownloadableFile(href)) return stash(fileLinkHtml(href, label));
    if (/^(https?:\/\/|mailto:)/i.test(href)) {
      return stash(`<a href="${escAttr(href)}" target="_blank" rel="noreferrer">${renderInlineMarkdown(label)}</a>`);
    }
    return match;
  });

  let html = escHtml(text);
  html = html.replace(/https?:\/\/[^\s<)]+/g, (url) => stash(`<a href="${escAttr(url)}" target="_blank" rel="noreferrer">${escHtml(url)}</a>`));
  html = html.replace(AUTO_FILE_RE, (_m, prefix, filePath) => `${prefix}${stash(fileLinkHtml(filePath, filePath))}`);
  html = html
    .replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/__([^_]+)__/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/_([^_]+)_/g, '<em>$1</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return html.replace(/\uE000(\d+)\uE001/g, (_m, id) => tokens[Number(id)] || '');
}
function renderMarkdown(text) {
  if (typeof marked === 'undefined') return escHtml(String(text ?? ''));
  const raw = String(text ?? '');
  const renderer = new marked.Renderer();

  renderer.code = function({ text, lang }) {
    const language = (lang || '').toLowerCase();
    if (language === 'diff' || language === 'patch') {
      return `<pre><code class="language-${escAttr(lang || '')}">${renderDiffLines(text)}</code></pre>`;
    }
    return `<pre><code class="language-${escAttr(lang || '')}">${escHtml(text)}</code></pre>`;
  };

  renderer.link = function({ href, title, tokens }) {
    const label = this.parser.parseInline(tokens);
    const titleAttr = title ? ` title="${escAttr(title)}"` : '';
    if (href && looksLikeDownloadableFile(href)) {
      return fileLinkHtml(href, typeof label === 'string' ? label.replace(/<[^>]+>/g, '') : href);
    }
    if (href && /^(https?:\/\/|mailto:)/i.test(href)) {
      return `<a href="${escAttr(href)}"${titleAttr} target="_blank" rel="noreferrer">${label}</a>`;
    }
    return `<a href="${escAttr(href || '')}"${titleAttr}>${label}</a>`;
  };

  renderer.codespan = function({ text }) {
    if (looksLikeDownloadableFile(text)) return fileLinkHtml(text, text);
    return `<code>${escHtml(text)}</code>`;
  };

  let html = marked.parse(raw, { renderer, breaks: false, gfm: true });

  html = html.replace(AUTO_FILE_RE, (_m, prefix, filePath) => `${prefix}${fileLinkHtml(filePath, filePath)}`);

  return html;
}
function statusClass(s) { return 's-'+(s||'queued'); }
function statusIcon(s) {
  return {completed:'✓',failed:'✗',running:'⟳',waiting_user:'?',blocked:'⚠',queued:'·'}[s] || '·';
}
const PHASES = ['plan','design','inspect_code','write_code','verify','finalize','execute'];
const PHASE_LABEL = {plan:'Plan',design:'Design',inspect_code:'Inspect',write_code:'Write',verify:'Verify',finalize:'Finalize',execute:'Execute'};

// ── Feed helpers ──────────────────────────────────────────────────────────
function scrollToBottom(force=false) {
  if (force || state.atBottom) {
    feed.scrollTop = feed.scrollHeight;
  }
}

feed.addEventListener('scroll', () => {
  const atB = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
  state.atBottom = atB;
  scrollBtn.style.display = atB ? 'none' : 'block';
});
scrollBtn.addEventListener('click', () => { state.atBottom = true; scrollToBottom(true); });

function appendToFeed(el) {
  const wasEmpty = feed.querySelector('#empty-state');
  if (wasEmpty) wasEmpty.style.display = 'none';
  feed.appendChild(el);
  scrollToBottom();
}

function makeMsgRow(avatarClass, avatarChar, fromLabel, fromClass, ts, bodyHtml) {
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `
    <div class="msg-avatar ${avatarClass}">${avatarChar}</div>
    <div class="msg-body">
      <div class="msg-header">
        <span class="msg-from ${fromClass}">${escHtml(fromLabel)}</span>
        <span class="msg-ts">${fmtTime(ts)}</span>
      </div>
      <div class="msg-text md">${bodyHtml}</div>
    </div>`;
  return row;
}
function appendSystemMessage(text, warn=false) {
  const row = makeMsgRow(warn ? 'warn' : 'system', warn ? '!' : 'i', warn ? 'Download' : 'System', '', new Date().toISOString(), renderMarkdown(text));
  appendToFeed(row);
}

function fileNameFromDisposition(disposition, fallback) {
  const utf8 = disposition?.match(/filename\*=UTF-8''([^;]+)/i);
  if (utf8?.[1]) {
    try { return decodeURIComponent(utf8[1]); } catch {}
  }
  const quoted = disposition?.match(/filename="([^"]+)"/i);
  return quoted?.[1] || fallback || 'download';
}

document.addEventListener('click', async (event) => {
  const link = event.target.closest?.('a.file-link');
  if (!link) return;
  event.preventDefault();
  const fallback = displayFileName(link.getAttribute('title') || link.textContent || 'download');
  try {
    const response = await fetch(link.href, { cache: 'no-store' });
    if (!response.ok) {
      let message = `Download failed (${response.status}).`;
      try {
        const data = await response.json();
        if (data?.error) message = data.error;
      } catch {
        const text = await response.text().catch(() => '');
        if (text) message = text.slice(0, 180);
      }
      appendSystemMessage(message, true);
      return;
    }
    const blob = await response.blob();
    const name = fileNameFromDisposition(response.headers.get('Content-Disposition'), fallback);
    const objectUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objectUrl;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
  } catch (error) {
    appendSystemMessage(String(error), true);
  }
});

// ── Task card ──────────────────────────────────────────────────────────────
function makeTaskCard(task) {
  const wrap = document.createElement('div');
  wrap.className = 'task-card';
  wrap.dataset.taskId = task.taskId;

  const modeLabel = task.mode === 'plan' ? 'plan-mode' : 'build-mode';
  const short = task.taskId.slice(0,8);

  wrap.innerHTML = `
    <div class="task-card-header">
      <span class="task-badge ${modeLabel}">${escHtml(task.kind || task.mode)}</span>
      <span class="task-card-id">${short}</span>
      <span class="task-card-title">${escHtml(task.summary || task.prompt || short)}</span>
      <span class="task-status-pill ${statusClass(task.status)}">${statusIcon(task.status)} ${escHtml(task.status)}</span>
    </div>
    <div class="phase-bar" data-phases=""></div>`;

  const phaseBar = wrap.querySelector('.phase-bar');
  const statusPill = wrap.querySelector('.task-status-pill');

  // Streaming output block (created lazily)
  const streamEl = document.createElement('div');
  streamEl.className = 'stream-block md';
  streamEl.style.display = 'none';
  wrap.appendChild(streamEl);

  taskEls.set(task.taskId, { card: wrap, statusPill, phaseBar, streamEl, streamText: '' });
  return wrap;
}

function updateTaskCard(taskId, updates) {
  const els = taskEls.get(taskId);
  if (!els) return;
  if (updates.status !== undefined) {
    els.statusPill.className = `task-status-pill ${statusClass(updates.status)}`;
    els.statusPill.textContent = `${statusIcon(updates.status)} ${updates.status}`;
  }
  if (updates.title !== undefined) {
    els.card.querySelector('.task-card-title').textContent = updates.title;
  }
}

function updatePhaseBar(taskId, phase, phaseStatus, note) {
  const els = taskEls.get(taskId);
  if (!els) return;
  const bar = els.phaseBar;
  // Track phases
  if (!phaseState.has(taskId)) phaseState.set(taskId, new Map());
  const ps = phaseState.get(taskId);
  ps.set(phase, { status: phaseStatus, note });

  // Rebuild bar
  bar.innerHTML = '';
  const seen = new Set();
  for (const [p, info] of ps.entries()) {
    seen.add(p);
    const dot = document.createElement('span');
    let cls = 'phase-dot';
    if (info.status === 'started' || info.status === 'in_progress') cls += ' active';
    else if (info.status === 'done') cls += ' done';
    else if (info.status === 'failed') cls += ' failed';
    dot.className = cls;
    dot.title = info.note || '';
    dot.innerHTML = `<span class="dot"></span>${PHASE_LABEL[p]||p}`;
    bar.appendChild(dot);
  }
}

function splitThinking(text) {
  var OPEN = '<think>', CLOSE = '</think>';
  var parts = [], pos = 0;
  while (pos < text.length) {
    var oi = text.indexOf(OPEN, pos);
    if (oi === -1) { parts.push({type:'content', text:text.slice(pos)}); break; }
    if (oi > pos) parts.push({type:'content', text:text.slice(pos, oi)});
    var ci = text.indexOf(CLOSE, oi + OPEN.length);
    if (ci === -1) { parts.push({type:'thinking', text:text.slice(oi + OPEN.length), open:true}); break; }
    parts.push({type:'thinking', text:text.slice(oi + OPEN.length, ci), open:false});
    pos = ci + CLOSE.length;
  }
  return parts;
}

function renderThinkingBlock(text, isOpen) {
  var label = isOpen ? 'Thinking…' : 'Thinking';
  var cls = isOpen ? ' thinking-block open' : ' thinking-block';
  return '<div class="' + cls.trim() + '" onclick="this.classList.toggle(&#39;open&#39;)">'
    + '<div class="thinking-header"><span class="thinking-arrow">◂</span>'
    + '<span class="thinking-label">' + label + '</span></div>'
    + '<div class="thinking-body">' + escHtml(text.trim()) + '</div></div>';
}

function renderStreamWithThinking(text) {
  var parts = splitThinking(text);
  if (!parts.length) return renderMarkdown(text);
  return parts.map(function(p) {
    if (p.type === 'thinking') return renderThinkingBlock(p.text, p.open);
    var t = p.text.trim();
    return t ? renderMarkdown(t) : '';
  }).join('');
}

function appendStreamToCard(taskId, text) {
  const els = taskEls.get(taskId);
  if (!els) return;
  els.streamEl.style.display = 'block';
  els.streamText = (els.streamText || '') + text;
  els.streamEl.innerHTML = renderStreamWithThinking(els.streamText);
  els.streamEl.scrollTop = els.streamEl.scrollHeight;
  scrollToBottom();
}

function renderToolOutput(output) {
  const text = String(output ?? '');
  if (looksLikeDiff(text)) return `<pre><code>${renderDiffLines(text)}</code></pre>`;
  return `<pre>${escHtml(text)}</pre>`;
}

// ── Tool call in feed ─────────────────────────────────────────────────────
function upsertToolCall(taskId, tool, input, output) {
  if (!toolState.has(taskId)) toolState.set(taskId, new Map());
  const tm = toolState.get(taskId);
  const key = `${tool}-${input.slice?.(0,40) || ''}`;

  // Find existing el
  if (tm.has(key)) {
    const el = tm.get(key);
    if (output !== undefined) {
      let ob = el.querySelector('.tool-output-body');
      if (ob) ob.innerHTML = renderToolOutput(output);
      el.dataset.hasOutput = 'true';
    }
    return;
  }

  if (output !== undefined && !input) {
    const pending = Array.from(tm.values()).reverse().find((el) => el.dataset.tool === tool && el.dataset.hasOutput !== 'true');
    if (pending) {
      const ob = pending.querySelector('.tool-output-body');
      if (ob) ob.innerHTML = renderToolOutput(output);
      pending.dataset.hasOutput = 'true';
      return;
    }
  }

  // Create new
  const el = document.createElement('div');
  el.className = 'tool-call';
  el.dataset.tool = tool;
  el.dataset.hasOutput = output !== undefined ? 'true' : 'false';
  el.innerHTML = `
    <div class="tool-call-header">
      <span style="color:var(--success);font-size:13px;">⚙</span>
      <span class="tool-name">${escHtml(tool)}</span>
      <span style="font-size:11.5px;color:var(--text-muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(truncate(input,60))}</span>
      <span class="tool-chevron">▶</span>
    </div>
    <div class="tool-body">
      <div class="tool-io">
        <div class="tool-io-label">Input</div>
        <pre>${escHtml(input)}</pre>
      </div>
      ${output !== undefined ? `<div class="tool-io" style="border-top:1px solid var(--border-soft)">
        <div class="tool-io-label">Output</div>
        <div class="tool-output-body">${renderToolOutput(output)}</div>
      </div>` : `<div class="tool-io" style="border-top:1px solid var(--border-soft)">
        <div class="tool-io-label">Output</div>
        <div class="tool-output-body" style="color:var(--text-muted)">waiting…</div>
      </div>`}
    </div>`;
  el.querySelector('.tool-call-header').addEventListener('click', () => {
    el.classList.toggle('open');
  });
  tm.set(key, el);

  // Attach to task card or feed
  const els = taskEls.get(taskId);
  if (els) {
    // Insert before streamEl
    els.card.insertBefore(el, els.streamEl);
  } else {
    appendToFeed(el);
  }
  scrollToBottom();
}

// ── Sidebar task item ─────────────────────────────────────────────────────
function makeSidebarItem(task) {
  const li = document.createElement('div');
  li.className = 'task-item';
  li.dataset.taskId = task.taskId;
  li.innerHTML = `
    <span class="task-icon" style="color:${statusToColor(task.status)}">${statusIcon(task.status)}</span>
    <div class="task-meta">
      <div class="task-title">${escHtml(truncate(task.summary || task.prompt || task.taskId, 32))}</div>
      <div class="task-time">${fmtTime(task.updatedAt || task.ts)}</div>
    </div>`;
  li.addEventListener('click', () => {
    document.querySelectorAll('.task-item').forEach(el => el.classList.remove('active'));
    li.classList.add('active');
    state.activeTaskId = task.taskId;
    // Scroll feed to the task card
    const card = feed.querySelector(`[data-task-id="${task.taskId}"]`);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  return li;
}

function updateSidebarItem(taskId, status, ts) {
  const li = taskList.querySelector(`[data-task-id="${taskId}"]`);
  if (!li) return;
  li.querySelector('.task-icon').style.color = statusToColor(status);
  li.querySelector('.task-icon').textContent = statusIcon(status);
  if (ts) li.querySelector('.task-time').textContent = fmtTime(ts);
}

function updateTaskTodos(taskId, todos) {
  const els = taskEls.get(taskId);
  if (!els) return;
  let todoEl = els.card.querySelector('.task-todos');
  if (!todos || !todos.length) {
    if (todoEl) todoEl.remove();
    return;
  }
  if (!todoEl) {
    todoEl = document.createElement('div');
    todoEl.className = 'task-todos';
    els.card.insertBefore(todoEl, els.streamEl);
  }
  todoEl.innerHTML = todos.map(t => {
    const check = t.status === 'done' ? '\u2611' : t.status === 'in_progress' ? '\u25CB' : '\u2610';
    const cls = t.status === 'done' ? 'todo-done' : t.status === 'in_progress' ? 'todo-active' : 'todo-pending';
    return `<div class="todo-item ${cls}"><span class="todo-check">${check}</span><span class="todo-text">${escHtml(t.text)}</span></div>`;
  }).join('');
}

function updateTaskGoalBadge(taskId, goal) {
  const els = taskEls.get(taskId);
  if (!els || !goal) return;
  let badge = els.card.querySelector('.goal-badge');
  if (!badge) {
    badge = document.createElement('div');
    badge.className = 'goal-badge';
    const header = els.card.querySelector('.task-card-header');
    if (header) header.appendChild(badge);
  }
  const label = goal.status === 'achieved' ? 'Goal \u2713' : goal.status === 'failed' ? 'Goal \u2717' : `Goal (${goal.status})`;
  badge.textContent = label;
  badge.className = `goal-badge goal-${goal.status}`;
}

function statusToColor(s) {
  return {completed:'var(--success)',failed:'var(--danger)',running:'var(--accent)',waiting_user:'var(--warning)',blocked:'var(--warning)',queued:'var(--text-muted)'}[s] || 'var(--text-muted)';
}

// ── Clarification bar ─────────────────────────────────────────────────────
function showClarification(clr) {
  state.pendingClarification = clr;
  clarText.textContent = clr.question || '';
  clarChoices.innerHTML = '';
  (clr.choices || []).forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'clarify-choice-btn';
    btn.textContent = c;
    btn.addEventListener('click', () => submitClarification(c));
    clarChoices.appendChild(btn);
  });

}

function hideClarification() {
  state.pendingClarification = null;
  clarBar.classList.remove('visible');
}

async function submitClarification(answer) {
  if (!state.pendingClarification) return;
  const { taskId, clarificationId } = state.pendingClarification;

modeTrigger.addEventListener('click', (e) => {

  modeDropdown.classList.toggle('open');
});
document.addEventListener('click', () => {

});
modeOptions.forEach(btn => {

function setMode(m) {
  state.mode = m;
  if (modeTrigger) modeTrigger.textContent = m === 'plan' ? 'Plan' : 'Build';
  modeOptions.forEach(b => b.classList.toggle('active', b.dataset.mode === m));
}

async function persistMode(m) {
  await fetch('/api/mode', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({mode:m}) });
  setMode(m);
}

function cycleMode() {
  const modes = ['build', 'plan'];
  const next = modes[(modes.indexOf(state.mode) + 1) % modes.length];
  void persistMode(next);

}

// ── Model select ──────────────────────────────────────────────────────────
modelSelect.addEventListener('change', async () => {
  const name = modelSelect.value;
  if (!name || name === '—') return;
  try {
    const r = await fetch('/api/model', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name}) });
    const data = await r.json().catch(() => ({}));
    if (r.ok) applyModelPayload(data);
    else appendSystemMessage(data?.error || `Model switch failed (${r.status}).`, true);
  } catch (error) {
    appendSystemMessage(String(error), true);
  }
});

function providerOf(entry) {
  if (!entry) return 'Other';
  const url = entry.baseUrl || '';
  if (/advibe/i.test(url)) return 'ADVibe';
  if (/volces|volcengine/i.test(url)) return 'Volcengine';
  if (/localhost|127\.0\.0\.1/i.test(url)) return 'Local';
  if (/anthropic/i.test(url)) return 'Anthropic';
  if (/openai/i.test(url)) return 'OpenAI';
  if (entry.backend === 'ollama') return 'Local';
  return 'Other';
}

function populateModelSelect(aliases, current) {
  modelSelect.innerHTML = '';
  const options = Array.from(new Set([current, ...(aliases || [])].filter(Boolean)));
  if (!options.length) { modelSelect.innerHTML = '<option>—</option>'; return; }
  const groups = {};
  options.forEach(a => {
    const entry = state.modelConfig?.models?.[a] || null;
    const p = providerOf(entry);
    (groups[p] = groups[p] || []).push(a);
  });
  const order = ['ADVibe', 'Volcengine', 'Anthropic', 'OpenAI', 'Local', 'Other'];
  order.forEach(p => {
    if (!groups[p]) return;
    const g = document.createElement('optgroup');
    g.label = p;
    groups[p].forEach(a => {
      const opt = document.createElement('option');
      opt.value = a; opt.textContent = a;
      if (a === current) opt.selected = true;
      g.appendChild(opt);
    });
    modelSelect.appendChild(g);
  });
}

function applyModelPayload(data) {
  if (!data) return;
  if (data.model) { state.model = data.model; modelLabel.textContent = data.model; }
  if (data.modelAliases) { state.modelAliases = data.modelAliases; populateModelSelect(data.modelAliases, data.model || state.model); }
  const cfg = data.modelConfig || data.config;
  if (cfg) state.modelConfig = cfg;
  if (data.configPath) state.configPath = data.configPath;
  if (data.artifactDir) state.artifactDir = data.artifactDir;
  if (!data.modelAliases && data.model) populateModelSelect(state.modelAliases, data.model);
  populateModelForm(state.model);
}

function currentModelEntry(alias) {
  return state.modelConfig?.models?.[alias] || null;
}

function requestOption(entry, key) {
  return entry?.requestOptions?.[key] ?? '';
}

function setField(name, value) {
  const el = modelConfigForm.elements[name];
  if (!el) return;
  el.value = value ?? '';
}

function populateModelForm(alias = state.model) {
  const entry = currentModelEntry(alias);
  setField('alias', alias && alias !== '—' ? alias : '');
  setField('model', entry?.model || (alias && alias !== '—' ? alias : ''));
  setField('backend', entry?.backend || '');
  setField('baseUrl', entry?.baseUrl || '');
  setField('apiKey', '');
  setField('contextWindow', entry?.contextWindow || '');
  setField('temperature', requestOption(entry, 'temperature'));
  setField('topP', requestOption(entry, 'topP'));
  setField('maxTokens', requestOption(entry, 'maxTokens'));
  setField('artifactsDir', state.modelConfig?.artifactsDir || '');
  setField('extraBody', entry?.requestOptions?.extraBody ? JSON.stringify(entry.requestOptions.extraBody, null, 2) : '');
  modelConfigForm.elements.select.checked = true;
  modelConfigError.textContent = '';
}

function openModelConfig() {
  populateModelForm(modelSelect.value || state.model);
  modelConfigModal.classList.add('visible');
  modelConfigModal.setAttribute('aria-hidden', 'false');
  setTimeout(() => modelConfigForm.elements.alias?.focus(), 0);
}

function closeModelConfig() {
  modelConfigModal.classList.remove('visible');
  modelConfigModal.setAttribute('aria-hidden', 'true');
  modelConfigError.textContent = '';
  promptInput.focus();
}

function readModelForm() {
  const form = modelConfigForm.elements;
  return {
    alias: form.alias.value.trim(),
    model: form.model.value.trim(),
    backend: form.backend.value,
    baseUrl: form.baseUrl.value.trim(),
    apiKey: form.apiKey.value.trim(),
    contextWindow: form.contextWindow.value,
    temperature: form.temperature.value,
    topP: form.topP.value,
    maxTokens: form.maxTokens.value,
    artifactsDir: form.artifactsDir.value.trim(),
    extraBody: form.extraBody.value.trim(),
    select: form.select.checked,
  };
}

async function saveModelConfig() {
  modelConfigError.textContent = '';
  const payload = readModelForm();
  if (!payload.alias || !payload.model) {
    modelConfigError.textContent = 'Alias and model are required.';
    return;
  }
  if (payload.extraBody) {
    try { JSON.parse(payload.extraBody); } catch {
      modelConfigError.textContent = 'Extra body must be valid JSON.';
      return;
    }
  }
  modelConfigSave.disabled = true;
  try {
    const r = await fetch('/api/models', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });
    const data = await r.json();
    if (!r.ok) {
      modelConfigError.textContent = data?.error || `Save failed (${r.status}).`;
      return;
    }
    applyModelPayload(data);
    closeModelConfig();
  } catch (error) {
    modelConfigError.textContent = String(error);
  } finally {
    modelConfigSave.disabled = false;
  }
}

modelConfigBtn.addEventListener('click', openModelConfig);
modelConfigClose.addEventListener('click', closeModelConfig);
modelConfigCancel.addEventListener('click', closeModelConfig);
modelConfigSave.addEventListener('click', saveModelConfig);
modelConfigModal.addEventListener('click', (event) => {
  if (event.target === modelConfigModal) closeModelConfig();
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && modelConfigModal.classList.contains('visible')) closeModelConfig();
  if (event.key === 'Tab' && event.shiftKey && !modelConfigModal.classList.contains('visible')) {
    event.preventDefault();
    cycleMode();
  }
});

// ── Send prompt ───────────────────────────────────────────────────────────
async function sendPrompt() {
  const text = promptInput.value.trim();
  if (!text) return;
  promptInput.value = '';
  promptInput.style.height = '';
  sendBtn.disabled = true;

  // Show in feed immediately
  const row = makeMsgRow('user','U','You','user-label', new Date().toISOString(), renderMarkdown(text));
  appendToFeed(row);

  try {
    const r = await fetch('/api/prompt', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, mode: state.mode }),
    });
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      appendSystemMessage(data?.error || `Prompt failed (${r.status}).`, true);
    }
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', sendPrompt);
promptInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); void sendPrompt(); }
});
promptInput.addEventListener('input', () => {
  promptInput.style.height = 'auto';
  promptInput.style.height = Math.min(promptInput.scrollHeight, 160) + 'px';
});

// ── SSE event handler ─────────────────────────────────────────────────────
function handleEvent(msg) {
  const { channel, event, tasks, mode, model, modelAliases } = msg;

  if (channel === 'snapshot') {
    if (mode) setMode(mode);
    applyModelPayload(msg);
    (tasks || []).forEach(t => hydrateTask(t));
    return;
  }

  if (channel === 'model_changed') {
    applyModelPayload({
      model: msg.model,
      modelAliases: msg.modelAliases,
      modelConfig: msg.modelConfig,
      artifactDir: msg.artifactDir,
    });
    return;
  }

  if (channel === 'mode_changed') {
    setMode(msg.mode);
    return;
  }

  if (channel === 'user_message') {
    // Already shown optimistically; skip to avoid duplicate
    return;
  }

  if (!event) return;

  switch (event.type) {
    case 'task_created': {
      const task = event.task;
      if (task.taskId === '__system__') return;
      if (state.tasks.has(task.taskId)) break;
      state.tasks.set(task.taskId, task);
      state.taskOrder.push(task.taskId);
      emptySidebar.style.display = 'none';
      const card = makeTaskCard(task);
      appendToFeed(card);
      const li = makeSidebarItem(task);
      taskList.appendChild(li);
      break;
    }
    case 'task_updated': {
      const task = event.task;
      if (task.taskId === '__system__') return;
      state.tasks.set(task.taskId, task);
      updateTaskCard(task.taskId, { status: task.status, title: task.summary || task.prompt });
      updateSidebarItem(task.taskId, task.status, event.ts);
      break;
    }
    case 'master_response': {
      // Presentation events own the main conversation feed; master_response is
      // kept for API/TUI compatibility.
      break;
    }
    case 'user_visible_message': {
      const row = makeMsgRow('master','P','Agent','master-label', event.ts, renderMarkdown(event.text));
      appendToFeed(row);
      break;
    }
    case 'task_phase': {
      updatePhaseBar(event.taskId, event.phase, event.status, event.note);
      break;
    }
    case 'task_output': {
      appendStreamToCard(event.taskId, event.text);
      break;
    }
    case 'tool_call': {
      upsertToolCall(event.taskId, event.tool, event.input, undefined);
      break;
    }
    case 'tool_result': {
      upsertToolCall(event.taskId, event.tool, '', event.output);
      break;
    }
    case 'task_mailbox_updated': {
      const mb = event.message;
      const els = taskEls.get(event.taskId);
      if (els) {
        const mbox = document.createElement('div');
        mbox.className = 'mailbox-msg';
        mbox.innerHTML = `<div class="mailbox-from">mailbox from ${escHtml(mb.sourceTaskId||'master')}</div><div class="msg-text md">${renderMarkdown(mb.text||'')}</div>`;
        els.card.insertBefore(mbox, els.streamEl);
        scrollToBottom();
      }
      break;
    }
    case 'writer_patch_submitted':
    case 'writer_patch_applied':
    case 'writer_patch_verified':
    case 'writer_conflict':
    case 'writer_failed': {
      const els = taskEls.get(event.taskId);
      if (els) {
        const patch = event.patch || {};
        let item = null;
        if (patch.patchId) {
          item = Array.from(els.card.querySelectorAll('[data-patch-id]')).find(el => el.dataset.patchId === patch.patchId);
        }
        if (!item) {
          item = document.createElement('div');
          item.className = 'mailbox-msg';
          if (patch.patchId) item.dataset.patchId = patch.patchId;
          els.card.insertBefore(item, els.streamEl);
        }
        const label = event.type.replace('writer_', '').replaceAll('_', ' ');
        const detail = event.error || patch.result || patch.summary || '';
        const diff = patchDiffMarkdown(patch);
        item.innerHTML = `<div class="mailbox-from">writer ${escHtml(label)}</div><div class="msg-text md">${renderMarkdown([detail, diff].filter(Boolean).join('\n\n'))}</div>`;
        scrollToBottom();
      }
      break;
    }
    case 'subagent_created':
    case 'subagent_updated': {
      const sub = event.subagent;
      // Show a small note under the parent task card
      const els = taskEls.get(sub.parentTaskId);
      if (els) {
        const subId = sub.subagentId || sub.taskId;
        const id = `subagent-${subId}`;
        let subEl = els.card.querySelector(`#${id}`);
        if (!subEl) {
          subEl = document.createElement('div');
          subEl.id = id;
          subEl.style.cssText = 'margin:3px 14px;padding:4px 10px;border-left:2px solid var(--accent);border-radius:0 4px 4px 0;font-size:11.5px;color:var(--text-muted);background:rgba(91,163,201,.05)';
          subEl.textContent = `subagent ${subId.slice(0,8)} - ${sub.status}`;
          els.card.insertBefore(subEl, els.streamEl);
          scrollToBottom();
        }
        subEl.textContent = `subagent ${subId.slice(0,8)} - ${sub.status}`;
      }
      break;
    }
    case 'subagent_output': {
      const els = taskEls.get(event.parentTaskId);
      if (els) appendStreamToCard(event.parentTaskId, event.text);
      break;
    }
    case 'clarification_requested': {
      showClarification({
        taskId: event.taskId,
        clarificationId: event.clarification.clarificationId,
        question: event.clarification.question,
        choices: event.clarification.choices || [],
      });
      break;
    }
    case 'clarification_answered': {
      hideClarification();
      break;
    }
    case 'todo_updated': {
      const task = state.tasks.get(event.taskId);
      if (task) {
        task.todos = event.todos;
        updateTaskTodos(event.taskId, event.todos);
      }
      break;
    }
    case 'goal_status_changed': {
      const task = state.tasks.get(event.taskId);
      if (task) {
        task.goal = event.goal;
        updateTaskGoalBadge(event.taskId, event.goal);
      }
      break;
    }
    case 'task_done': {
      updateTaskCard(event.taskId, { status: event.status });
      updateSidebarItem(event.taskId, event.status, event.ts);
      break;
    }
  }
}

// ── Hydrate snapshot tasks ────────────────────────────────────────────────
function hydrateTask(task) {
  if (task.taskId === '__system__') return;
  if (state.tasks.has(task.taskId)) return;
  state.tasks.set(task.taskId, task);
  state.taskOrder.push(task.taskId);
  emptySidebar.style.display = 'none';
  const card = makeTaskCard(task);
  appendToFeed(card);
  const li = makeSidebarItem(task);
  taskList.appendChild(li);
  if (task.todos?.length) updateTaskTodos(task.taskId, task.todos);
  if (task.goal) updateTaskGoalBadge(task.taskId, task.goal);
  (task.visibleMessages || []).forEach(message => {
    const row = makeMsgRow('master','P','Agent','master-label', message.ts, renderMarkdown(message.text));
    appendToFeed(row);
  });
}

// ── SSE connection ────────────────────────────────────────────────────────
let sse = null;
let reconnectTimer = null;

function connect() {
  if (sse) { try { sse.close(); } catch {} }
  sse = new EventSource('/api/events');
  sse.onopen = () => {
    if (connDot) connDot.className = 'connected';
    clearTimeout(reconnectTimer);
  };
  sse.onmessage = (e) => {
    try { handleEvent(JSON.parse(e.data)); } catch {}
  };
  sse.onerror = () => {
    if (connDot) connDot.className = 'disconnected';
    sse.close();
    reconnectTimer = setTimeout(connect, 2500);
  };
}

// ── Theme toggle ───────────────────────────────────────────────────────────
const themeBtn = document.getElementById('theme-toggle');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  if (themeBtn) themeBtn.textContent = t === 'light' ? '\u2600' : '\uD83C\uDF19';
  try { localStorage.setItem('theme', t); } catch {}
}
if (themeBtn) themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  applyTheme(next);
});
applyTheme(localStorage.getItem('theme') || 'dark');

// ── Init ──────────────────────────────────────────────────────────────────
(async () => {
  try {
    const r = await fetch('/api/state');
    const data = await r.json();
    if (data.mode) setMode(data.mode);
    applyModelPayload(data);
    (data.tasks || []).forEach(hydrateTask);
  } catch {}
  connect();
})();
</script>
