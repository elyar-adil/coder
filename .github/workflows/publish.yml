name: Publish to npm

on:
  push:
    tags:
      - "v*"
  # A failed publish cannot be retried by pushing the same immutable tag.
  # Keep the tag trigger for automatic releases, and offer an explicit retry
  # path that checks out and validates the selected release tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v0.4.1)
        required: true
        type: string

permissions:
  contents: read
  id-token: write # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # NOTE: no registry-url. Setting it makes setup-node write an (empty)
      # _authToken line into .npmrc, which blocks npm's OIDC trusted-publishing
      # detection (ENEEDAUTH). Trusted publishing needs no token at all.
      # Node 22 is used for the test suite (verified green); Node 24 is
      # switched in right before publishing because its bundled npm (>= 11.5.1)
      # is required for OIDC trusted publishing.
      - name: Setup Node.js (tests)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify tag matches package.json version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node -e "
            const pkg = require('./package.json');
            const tag = process.env.RELEASE_TAG;
            if ('v' + pkg.version !== tag) {
              console.error('Tag ' + tag + ' does not match package.json version v' + pkg.version);
              process.exit(1);
            }
          "

      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Setup Node.js (publish, npm >= 11.5.1)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify npm supports trusted publishing
        run: |
          node -v
          npm -v
          node -e "
            const v = parseInt(require('child_process').execSync('npm -v').toString().trim(), 10);
            if (v < 11) { console.error('npm < 11: no OIDC trusted publishing support'); process.exit(1); }
          "
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:+set}"

      - name: Publish
        # Trusted publishing: no token. npm (>=11.5.1) detects the OIDC
        # environment from ACTIONS_ID_TOKEN_REQUEST_* and authenticates against
        # the trusted-publisher mapping configured on npmjs.com. Provenance is
        # generated automatically for public repo/package publishes.
        run: npm publish --loglevel=verbose
        env:
          NODE_AUTH_TOKEN: "" # keep stale/secret tokens from interfering
