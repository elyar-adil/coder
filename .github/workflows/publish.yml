name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      - run: npm ci

      # npm >= 11.5.1 才支持 OIDC trusted publishing
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        run: |
          node -e "
            const pkg = require('./package.json');
            const tag = process.env.GITHUB_REF_NAME;
            if ('v' + pkg.version !== tag) {
              console.error('Tag ' + tag + ' does not match package.json version v' + pkg.version);
              process.exit(1);
            }
          "

      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Publish
        # actions/setup-node injects the repo's NODE_AUTH_TOKEN secret into the
        # generated .npmrc when registry-url is set. If that token is stale or
        # lacks publish rights, npm never falls back to OIDC trusted publishing
        # and PUT returns 404. Unset it so provenance-based OIDC auth is used.
        env:
          NODE_AUTH_TOKEN: ""
        run: npm publish --provenance
